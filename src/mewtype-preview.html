<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MewType · 虚拟服装动作图鉴</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14131a;color:#eee9ec;font:14px "Microsoft YaHei",sans-serif}main{max-width:1480px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{margin:0 0 8px;font-size:25px}p{color:#b5a8b7;line-height:1.7}a{color:#e6b7ca}.badge{border:1px solid #79536a;padding:9px 12px;white-space:nowrap;color:#efc8d4;border-radius:5px}.controls{position:sticky;top:0;z-index:2;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 0;background:#14131af2}button,select{font:inherit;color:inherit;background:#2b2331;border:1px solid #765c76;border-radius:4px;padding:10px 14px;min-height:40px}button{cursor:pointer}button:hover{background:#4b3145}.note{font-size:12px;color:#b5a8b7}.hero{display:grid;grid-template-columns:1fr 290px;gap:20px;border:1px solid #544155;background:#211e2c;border-radius:7px;overflow:hidden}.hero canvas{width:100%;display:block;background:linear-gradient(#292137,#181923)}aside{padding:22px 20px 20px 0}aside h2{font-size:20px;overflow-wrap:anywhere}aside p{font-size:12px}.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-top:20px}.tile{margin:0;border:1px solid #453b4b;background:#24212d;border-radius:5px;overflow:hidden;cursor:pointer}.tile.selected{border-color:#efbad0;background:#3b2c3d}.tile canvas{display:block;width:100%;height:auto}.tile figcaption{padding:9px 5px;font:11px Consolas,monospace;overflow-wrap:anywhere;min-height:44px}.group-name{grid-column:1/-1;margin:12px 0 1px;font-size:14px;color:#d4b7ce}footer{margin:24px 0;color:#a89bac;font-size:12px}#error{color:#ffbac2}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{grid-template-columns:1fr}aside{padding:0 20px 15px}header{display:block}.badge{display:inline-block;margin-bottom:8px}}@media(max-width:520px){main{padding:18px 10px}h1{font-size:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{gap:7px}select{max-width:100%}button,select{padding:9px}}
</style></head><body><main>
<header><div><h1>MewType · 虚拟服装动作图鉴</h1><p>虚拟服装 · 点击动作查看完整人物与落脚位置</p></div><span class="badge" id="status">载入中</span></header>
<div class="controls"><select id="character" aria-label="选择角色"></select><select id="form" aria-label="选择形态"></select><button id="previous">上一张</button><button id="next">下一张</button><button id="play" aria-pressed="false">轮播动作</button><label><input type="checkbox" id="mirror">朝向左侧</label><span class="note" id="count"></span></div>
<div class="hero"><canvas width="1040" height="620" id="preview" aria-label="角色动作"></canvas><aside><h2 id="name"></h2><p id="details"></p><p>底线表示人物的地面锚点。蹲伏、跳跃和倒地使用各自动作的显示尺寸。</p><p id="completeness"></p></aside></div>
<p id="error" role="alert"></p><div id="poses" class="grid"></div><footer>本页包含当前预览的全部人物图像，可离线打开。<a href="index.html">进入格斗游戏</a></footer>
</main><script>/*__MEWTYPE_PREVIEW__*/</script><script>
(async()=>{'use strict';
const a=window.MEWTYPE_PREVIEW,$=id=>document.getElementById(id),groups=['站立与移动','受击、倒地与胜利','投掷与轻击连段','连段、重击与蹲伏','蹲伏与空中攻击','空中攻击与技能 U / I','技能 O与大招'];
let selected=0,active=null,atlas=null,playing=false,last=0,request=0;
const cache=new Map(),load=src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('图像载入失败'));im.src=src;});
const total=a.forms.reduce((sum,f)=>sum+f.frames.length,0);$('status').textContent=(a.partial?'制作中 · ':'已收录 · ')+total+' / '+a.expected+' 张';
const ids=[...new Set(a.forms.map(f=>f.id))];ids.forEach(id=>{const f=a.forms.find(f=>f.id===id);$('character').add(new Option(f.name,String(id)));});
function sprite(c,f,x,y,scale=1){const ratio=f.height/f.h*scale;c.drawImage(atlas,f.x,f.y,f.w,f.h,x-f.ax*ratio,y-f.ay*ratio,f.w*ratio,f.h*ratio);}
function render(){if(!active||!atlas)return;const f=active.frames[selected],c=$('preview').getContext('2d');c.clearRect(0,0,1040,620);c.strokeStyle='#83617d';c.lineWidth=1;c.beginPath();c.moveTo(80,535);c.lineTo(960,535);c.stroke();c.save();c.translate(520,0);c.scale($('mirror').checked?-1:1,1);sprite(c,f,0,535,1.75);c.restore();c.fillStyle='#efbbd0';c.beginPath();c.arc(520,535,4,0,Math.PI*2);c.fill();$('name').textContent=f.name;$('details').textContent=active.name+' · '+('虚拟服装')+' · 第 '+(f.group+1)+' 组';$('count').textContent=(selected+1)+' / '+active.frames.length;$('completeness').textContent=active.frames.length===54?'本形态已收录全部 54 张动作。':'本形态目前收录 '+active.frames.length+' / 54 张动作；完整稿仍在制作。';document.querySelectorAll('.tile').forEach((tile,i)=>tile.classList.toggle('selected',i===selected));}
function select(index){selected=(index+active.frames.length)%active.frames.length;render();}
async function openForm(){const token=++request,chosen=a.forms.find(f=>String(f.id)===$('character').value&&f.form===$('form').value);if(!chosen)return;if(!cache.has(chosen))cache.set(chosen,load(chosen.atlas));const image=await cache.get(chosen);if(token!==request)return;active=chosen;atlas=image;selected=0;$('poses').replaceChildren();let group=-1;active.frames.forEach((f,i)=>{if(f.group!==group){group=f.group;const h=document.createElement('h3');h.className='group-name';h.textContent=(group+1)+' · '+groups[group];$('poses').append(h);}const tile=document.createElement('figure');tile.className='tile';tile.dataset.name=f.name;tile.tabIndex=0;tile.setAttribute('role','button');tile.setAttribute('aria-label',f.name);const canvas=document.createElement('canvas');canvas.width=220;canvas.height=260;const c=canvas.getContext('2d'),ratio=Math.min(200/f.w,240/f.h);c.drawImage(atlas,f.x,f.y,f.w,f.h,(220-f.w*ratio)/2,250-f.h*ratio,f.w*ratio,f.h*ratio);const caption=document.createElement('figcaption');caption.textContent=f.name;tile.append(canvas,caption);tile.onclick=()=>select(i);tile.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(i);}};$('poses').append(tile);});render();window.mewtypePreviewReady=true;}
function chooseCharacter(){const previous=$('form').value;$('form').replaceChildren(...a.forms.filter(f=>String(f.id)===$('character').value).map(f=>new Option('虚拟服装',f.form)));if([...$('form').options].some(o=>o.value===previous))$('form').value=previous;return openForm();}
$('character').onchange=()=>chooseCharacter().catch(fail);$('form').onchange=()=>openForm().catch(fail);$('previous').onclick=()=>select(selected-1);$('next').onclick=()=>select(selected+1);$('mirror').onchange=render;$('play').onclick=()=>{playing=!playing;last=performance.now();$('play').textContent=playing?'暂停轮播':'轮播动作';$('play').setAttribute('aria-pressed',String(playing));};
function fail(error){$('error').textContent=error.message;console.error(error);}function tick(time){if(playing&&active&&time-last>650){last=time;select(selected+1);}requestAnimationFrame(tick);}if(!a.forms.length){$('error').textContent='当前还没有可预览的完整动作组。';return;}await chooseCharacter();requestAnimationFrame(tick);
})().catch(error=>{document.getElementById('error').textContent='图鉴加载失败：'+error.message;console.error(error);});
</script></body></html>
